<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Anna University Simulated Campus Recruitment Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .login-card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg), 0 0 35px rgba(230, 161, 0, 0.12);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #1e3a5f 0%, #0c1c30 100%);
      border: 2px solid var(--gold-500);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-400);
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: var(--shadow-gold);
    }
    .demo-accounts {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .demo-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.6rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
    }
    .demo-btn:hover {
      background: rgba(230, 161, 0, 0.1);
      border-color: var(--border-accent);
      color: var(--gold-400);
    }
    .demo-btn strong {
      display: block;
      color: #ffffff;
      font-size: 0.8rem;
    }
    .alert-box {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      display: none;
    }
    .alert-error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">AU</div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Student Recruitment Portal</h1>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.35rem;">
          Centre for University-Industry Collaboration (CUIC)
        </p>
      </div>

      <div id="login-error" class="alert-box alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="student-id">Student ID / Roll No</label>
          <input 
            type="text" 
            id="student-id" 
            name="studentId" 
            class="form-control" 
            placeholder="e.g. AU2027CSE001" 
            required 
            data-testid="student-id"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            data-testid="password"
          >
        </div>

        <button 
          type="submit" 
          class="btn btn-primary" 
          style="width: 100%; margin-top: 0.5rem;" 
          data-testid="login-button"
        >
          Sign In to Portal
        </button>
      </form>

      <div class="demo-accounts">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">
            Demo Credentials (1-Click Fill)
          </span>
        </div>
        <div class="demo-grid">
          <button class="demo-btn" type="button" onclick="fillDemo('AU2027CSE001', 'student123')">
            <strong>Arjun Kumar</strong>
            <span>CSE • Final • CGPA 8.36</span>
          </button>
          <button class="demo-btn" type="button" onclick="fillDemo('AU2027ECE002', 'student123')">
            <strong>Priya Sharma</strong>
            <span>ECE • Final • CGPA 7.42</span>
          </button>
          <button class="demo-btn" type="button" onclick="fillDemo('AU2028CSE003', 'student123')">
            <strong>Karthik V</strong>
            <span>CSE • Pre-Final • 1 Backlog</span>
          </button>
          <button class="demo-btn" type="button" onclick="fillDemo('ADMIN001', 'admin123')">
            <strong>Placement Admin</strong>
            <span>Director, CUIC</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script>
    API.renderNavbar('login');
    API.renderFooter();

    function fillDemo(id, pass) {
      document.getElementById('student-id').value = id;
      document.getElementById('password').value = pass;
    }

    // Auto-fill Arjun Kumar by default for seamless benchmark execution
    fillDemo('AU2027CSE001', 'student123');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const studentId = document.getElementById('student-id').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const user = await API.login(studentId, password);
        if (user.role === 'ADMIN') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        errBox.textContent = err.message || 'Login failed. Please verify credentials.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
